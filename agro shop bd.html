<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A5 Auto Invoice Generator - Agro Shop</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'SolaimanLipi', 'Segoe UI', Tahoma, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f0f2f5;
      padding: 20px;
    }

    .main-container {
      display: flex;
      gap: 20px;
      max-width: 1150px;
      margin: 0 auto;
    }

    /* Input Area */
    .input-section {
      flex: 1;
      background: #ffffff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      border-top: 4px solid #0056b3;
    }

    .input-section h3 {
      color: #0056b3;
      border-bottom: 2px solid #e1e4e8;
      padding-bottom: 8px;
      font-size: 16px;
      margin-bottom: 12px;
    }

    textarea {
      width: 100%;
      height: 350px;
      padding: 12px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      font-size: 14px;
      line-height: 1.6;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: #0056b3;
      box-shadow: 0 0 5px rgba(0, 86, 179, 0.2);
    }

    .btn-group {
      margin-top: 15px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      transition: opacity 0.2s;
    }

    .btn:hover { opacity: 0.9; }

    .btn-print { 
      grid-column: span 2; 
      background-color: #0056b3; 
      color: white; 
      font-size: 16px; 
      padding: 15px;
      box-shadow: 0 4px 10px rgba(0, 86, 179, 0.3);
    }

    .btn-parse { background-color: #28a745; color: white; }
    .btn-download { background-color: #ffc107; color: #212529; }
    .btn-history { background-color: #17a2b8; color: white; grid-column: span 2; }
    .btn-clear { background-color: #dc3545; color: white; grid-column: span 2; }

    /* Preview Container */
    .preview-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
    }

    /* Standard A5 Invoice Layout */
    .invoice-card {
      width: 148mm;
      min-height: 210mm;
      background: #fff;
      border: 1px solid #ccc;
      padding: 10mm;
      color: #222;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-size: 13px;
      line-height: 1.4;
      border-radius: 4px;
    }

    /* Vibrant Colorful Header for Screen Display */
    .header-brand-wrapper {
      text-align: center;
      background: linear-gradient(135deg, #0d6efd 0%, #003d82 100%);
      color: #ffffff;
      padding: 14px 10px;
      border-radius: 6px;
      margin-bottom: 10px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.15);
    }

    .header-brand-title {
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #ffffff;
    }

    .header-brand-subtitle {
      font-size: 12px;
      color: #ffc107;
      margin-top: 3px;
      font-weight: 600;
    }

    .top-meta-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      align-items: center;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 8px;
      background-color: #f1f3f5;
      padding: 5px 8px;
      border-radius: 4px;
      color: #333;
      gap: 8px;
    }

    .top-meta-row span {
      display: block;
      width: 100%;
      text-align: center;
      background: #fff;
      padding: 5px 6px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-meta-row span:first-child {
      text-align: left;
      padding-left: 8px;
    }

    .top-meta-row span:last-child {
      text-align: right;
      padding-right: 8px;
    }

    .address-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 2px solid #0056b3;
      padding-bottom: 8px;
      margin-bottom: 8px;
      gap: 10px;
    }

    .address-box h4 {
      margin: 0 0 4px 0;
      font-size: 13px;
      text-decoration: underline;
      color: #0056b3;
    }

    .sender-box { text-align: right; }

    .table-header {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      font-size: 13px;
      background-color: #0056b3;
      color: white;
      padding: 6px 8px;
      border-radius: 3px;
      margin-bottom: 6px;
    }

    .items-list {
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-grow: 1;
      padding: 0 4px;
    }

    .item-row {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
      border-bottom: 1px dotted #dee2e6;
    }

    .item-row span:last-child,
    .summary-row span:last-child {
      text-align: right;
      min-width: 70px;
      font-weight: 600;
    }

    .subtotal-row {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      padding: 6px 4px;
      margin-top: 4px;
      border-top: 1px dashed #adb5bd;
      font-size: 13px;
      color: #333;
    }

    .summary-section {
      border-top: 2px solid #0056b3;
      padding-top: 6px;
      font-size: 13px;
      margin-top: auto;
      background-color: #f8f9fa;
      padding: 8px;
      border-radius: 4px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      margin-bottom: 3px;
    }

    .total-row {
      border-top: 1px dashed #adb5bd;
      padding-top: 4px;
      font-size: 14px;
      color: #0056b3;
    }

    .page-footer {
      text-align: right;
      font-size: 11px;
      font-weight: bold;
      color: #6c757d;
      border-top: 1px solid #dee2e6;
      padding-top: 4px;
      margin-top: 6px;
    }

    /* History Modal Styling */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #fff;
      width: 90%;
      max-width: 800px;
      max-height: 85vh;
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #0056b3;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    .modal-header h3 { color: #0056b3; }

    .close-btn {
      background: #dc3545;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .history-search {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      font-size: 14px;
    }

    .history-list-container {
      overflow-y: auto;
      flex-grow: 1;
      max-height: 50vh;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid #e9ecef;
      font-size: 13px;
    }

    .history-item:hover {
      background-color: #f8f9fa;
    }

    .history-actions button {
      padding: 5px 10px;
      margin-left: 5px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    .btn-view { background: #0056b3; color: white; }
    .btn-del { background: #dc3545; color: white; }

    /* Strict A5 Print Configuration */
    @media print {
      @page {
        size: A5 portrait;
        margin: 0mm !important;
      }

      html, body {
        width: 148mm;
        height: 210mm;
        margin: 0 !important;
        padding: 0 !important;
        background: #fff !important;
      }

      .input-section, .no-print, .modal-overlay { display: none !important; }

      .main-container, .preview-section {
        display: block;
        width: 100%;
        margin: 0;
        padding: 0;
      }

      .invoice-card {
        border: none !important;
        box-shadow: none !important;
        width: 148mm !important;
        height: 210mm !important;
        padding: 10mm !important;
        margin: 0 auto;
        page-break-after: always;
        page-break-inside: avoid;
        background: #fff !important;
        color: #000 !important;
      }

      .invoice-card:last-child { page-break-after: avoid; }

      .header-brand-wrapper {
        background: #fff !important;
        color: #000 !important;
        border: 2px solid #000 !important;
        box-shadow: none !important;
      }
      .header-brand-title { color: #000 !important; }
      .header-brand-subtitle { color: #000 !important; }
      
      .top-meta-row {
        background: #fff !important;
        border: none !important;
        padding: 0 !important;
        margin-bottom: 8px !important;
        gap: 6px !important;
      }
      .top-meta-row span {
        border: 1px solid #000 !important;
        background: #fff !important;
        padding: 5px 6px !important;
      }

      .address-grid {
        border-bottom: 2px solid #000 !important;
      }
      .address-box h4 {
        color: #000 !important;
      }
      .table-header {
        background-color: #fff !important;
        color: #000 !important;
        border-top: 1px solid #000 !important;
        border-bottom: 2px solid #000 !important;
      }
      .summary-section {
        background: #fff !important;
        border-top: 2px solid #000 !important;
      }
      .summary-row, .total-row, .subtotal-row {
        color: #000 !important;
      }
      .page-footer {
        color: #000 !important;
        border-top: 1px solid #000 !important;
      }
    }
  </style>
  <!-- html2pdf library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

<div class="main-container">
  <div class="input-section no-print">
    <h3>এখানে তথ্য পেস্ট করুন</h3>
    <textarea id="rawText" placeholder="গ্রাহকের নাম, মোবাইল, ঠিকানা এবং পণ্যের বিবরণ পেস্ট করুন..."></textarea>
    <div class="btn-group">
      <button class="btn btn-print" onclick="handlePrint()">🖨️ প্রিন্ট করুন (A5)</button>
      <button class="btn btn-parse" onclick="parseText()">ইনভয়েস তৈরি করুন</button>
      <button class="btn btn-download" onclick="handleDownload()">📥 ডাউনলোড করুন</button>
      <button class="btn btn-history" onclick="openHistoryModal()">📜 ইনভয়েস হিস্ট্রি খুঁজুন</button>
      <button class="btn btn-clear" onclick="clearCacheAndInput()">🔄 রিসেট / ক্লিয়ার</button>
    </div>
  </div>

  <div class="preview-section" id="pagesContainer"></div>
</div>

<!-- History Modal -->
<div class="modal-overlay" id="historyModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>পূর্ববর্তী ইনভয়েস হিস্ট্রি (সঞ্চয় তালিকা)</h3>
      <button class="close-btn" onclick="closeHistoryModal()">✕ বন্ধ করুন</button>
    </div>
    <input type="text" id="historySearchInput" class="history-search" placeholder="গ্রাহকের নাম, মোবাইল, ইনভয়েস আইডি বা পার্সেল আইডি দিয়ে খুঁজুন..." onkeyup="filterHistory()">
    <div class="history-list-container" id="historyListContainer">
      <!-- History items will load here -->
    </div>
  </div>
</div>

<script>
  const defaultSample = `গ্রাহকের নাম: সাব্বির আহমেদ
মোবাইল: ০১৭৭৪২৫৬৩৮৭
Parcel ID: 279933868

ঠিকানা:
গ্রাম: হোয়াইট কান্দি
থানা: ফুলপুর
জেলা: ময়মনসিংহ

পণ্যের বিবরণ:
• ৩ লিটার কুলার বক্স — ৳১,২০০
• ডিজিটাল থার্মোমিটার — ৳১৩০
• বুট জুতা — ৳৬০০
• ওজন পরিমাপক টেপ — ৳৪৫০

পণ্যের মোট মূল্য: ৳২,৩৮০
ডেলিভারি চার্জ: ৳১০০
সর্বমোট: ৳২,৪৮০`;

  if(!localStorage.getItem('gsbd_raw_text')) {
    document.getElementById('rawText').value = defaultSample;
  } else {
    document.getElementById('rawText').value = localStorage.getItem('gsbd_raw_text');
  }

  function bnToEnNum(str) {
    const bnDigits = {'০':'0', '১':'1', '২':'2', '৩':'3', '৪':'4', '৫':'5', '৬':'6', '৭':'7', '৮':'8', '৯':'9'};
    return String(str).replace(/[০-৯]/g, d => bnDigits[d]);
  }

  function enToBnNum(num) {
    const bnDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
    return String(num).replace(/[0-9]/g, d => bnDigits[d]);
  }

  function extractAmount(text) {
    if (!text) return 0;
    const cleanText = bnToEnNum(text);
    const match = cleanText.match(/(\d+[\d,]*)/);
    if (match) return parseFloat(match[1].replace(/,/g, '')) || 0;
    return 0;
  }

  function getNextSerialNo() {
    let lastNum = parseInt(localStorage.getItem('asbd_seq_number') || '1006');
    let nextNum = lastNum + 1;
    localStorage.setItem('asbd_seq_number', nextNum);
    return 'ASBD-' + nextNum;
  }

  function clearCacheAndInput() {
    document.getElementById('rawText').value = '';
    localStorage.removeItem('gsbd_raw_text');
    document.getElementById('pagesContainer').innerHTML = '';
    alert('ক্যাশ এবং ইনপুট সফলভাবে ক্লিয়ার করা হয়েছে!');
  }

  function saveToHistory(serialNo, courierId, custName, custPhone, formattedDate, rawText) {
    let history = JSON.parse(localStorage.getItem('gsbd_invoice_history') || '[]');
    let existingIndex = history.findIndex(item => item.serialNo === serialNo);
    let record = {
      serialNo: serialNo,
      courierId: courierId || '',
      custName: custName,
      custPhone: custPhone || '',
      date: formattedDate,
      rawText: rawText,
      timestamp: Date.now()
    };
    if(existingIndex >= 0) {
      history[existingIndex] = record;
    } else {
      history.unshift(record);
    }
    localStorage.setItem('gsbd_invoice_history', JSON.stringify(history));
  }

  function parseText() {
    const rawTextArea = document.getElementById('rawText');
    const text = rawTextArea.value.trim();
    localStorage.setItem('gsbd_raw_text', text);

    const container = document.getElementById('pagesContainer');
    container.innerHTML = '';

    if(!text) {
      container.innerHTML = '<p style="color:red; font-weight:bold;">অনুগ্রহ করে কিছু তথ্য পেস্ট করুন।</p>';
      return null;
    }

    const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);

    let custName = '-';
    let custPhone = ''; 
    let courierId = '';
    let addressBuffer = [];
    let items = [];
    let deliveryCharge = 0;
    let explicitSubtotal = null;

    let isAddressSection = false;
    let isProductsSection = false;

    lines.forEach(line => {
      const lowerLine = line.toLowerCase();
      if (lowerLine.includes('parcel id') || lowerLine.includes('cn#') || lowerLine.includes('tracking') || lowerLine.includes('courier')) {
        courierId = line; 
      } else {
        let cleanNumMatch = line.match(/^(\d{6,12})$/);
        if (cleanNumMatch) {
          courierId = 'Parcel ID: ' + cleanNumMatch[1];
        }
      }

      if ((line.includes('গ্রাহকের নাম:') || line.includes('নাম:')) && !line.includes('প্রেরক')) {
        custName = line.split(':')[1]?.trim() || '-';
        isAddressSection = false;
        isProductsSection = false;
      }
      else if (line.includes('মোবাইল:') && !line.includes('প্রেরক') && !isProductsSection && !isAddressSection) {
        let extractedPhone = line.split(':')[1]?.trim() || '';
        if(extractedPhone) {
          custPhone = extractedPhone;
        }
      }
      else if (line.includes('ঠিকানা:')) {
        isAddressSection = true;
        isProductsSection = false;
        const restOfLine = line.replace('ঠিকানা:', '').trim();
        if(restOfLine) addressBuffer.push(restOfLine);
      }
      else if (line.includes('পণ্যের বিবরণ:')) {
        isAddressSection = false;
        isProductsSection = true;
      }
      else if (line.includes('পণ্যের মোট মূল্য:') || line.includes('মোট মূল্য:')) {
        isAddressSection = false;
        isProductsSection = false;
        explicitSubtotal = line.split(':')[1]?.trim() || '';
      }
      else if (line.includes('ডেলিভারি চার্জ:')) {
        isAddressSection = false;
        isProductsSection = false;
        deliveryCharge = extractAmount(line.split(':')[1]);
      }
      else if (line.includes('সর্বমোট:')) {
        isAddressSection = false;
        isProductsSection = false;
      }
      else {
        if (isAddressSection && !line.includes('প্রেরক:')) {
          addressBuffer.push(line);
        } else if (isProductsSection) {
          let namePart = line, pricePart = '';
          if (line.includes('—')) {
            const parts = line.split('—');
            namePart = parts[0].trim();
            pricePart = parts[1].trim();
          } else if (line.includes('-')) {
            const parts = line.split('-');
            namePart = parts[0].trim();
            pricePart = parts[1].trim();
          }
          const itemPrice = extractAmount(pricePart);
          items.push({ name: namePart, priceText: pricePart, priceVal: itemPrice });
        }
      }
    });

    const custAddress = addressBuffer.join(' ') || '-';
    let calcSubtotal = 0;
    items.forEach(i => calcSubtotal += i.priceVal);
    let displaySubtotalText = explicitSubtotal ? explicitSubtotal : ('৳' + enToBnNum(calcSubtotal.toLocaleString('en-US')));
    let subtotalVal = extractAmount(displaySubtotalText);
    if(subtotalVal === 0 && calcSubtotal > 0) subtotalVal = calcSubtotal;

    let pagesData = [];
    let remainingItems = [...items];

    if (items.length <= 8) {
      pagesData.push(remainingItems.splice(0, items.length));
    } else {
      pagesData.push(remainingItems.splice(0, 12));
      while (remainingItems.length > 0) {
        if (remainingItems.length <= 10) {
          pagesData.push(remainingItems.splice(0, remainingItems.length));
        } else {
          pagesData.push(remainingItems.splice(0, 14));
        }
      }
    }

    const totalPages = pagesData.length;
    const serialNo = getNextSerialNo();
     
    const todayObj = new Date();
    const formattedDate = todayObj.toLocaleDateString('bn-BD', { year: 'numeric', month: 'numeric', day: 'numeric' });

    saveToHistory(serialNo, courierId, custName, custPhone, formattedDate, text);

    pagesData.forEach((pageItems, index) => {
      const pageNum = index + 1;
      const isLastPage = (pageNum === totalPages);

      const pageDiv = document.createElement('div');
      pageDiv.className = 'invoice-card';

      let pageContent = `
        <div>
          <div class="header-brand-wrapper">
            <div class="header-brand-title">AGRO SHOP BD</div>
            <div class="header-brand-subtitle">Reliable Online Shopping & Veterinary Solutions</div>
          </div>
          <div class="top-meta-row">
            <span>${serialNo}</span>
      `;
      
      if (courierId) {
        pageContent += `<span>${courierId}</span>`;
      } else {
        pageContent += `<span></span>`;
      }

      pageContent += `
            <span>তারিখ: ${enToBnNum(formattedDate)}</span>
          </div>
          <div class="address-grid">
            <div class="address-box">
              <h4>প্রাপক (Customer):</h4>
              <div><b>নাম:</b> ${custName}</div>
              <div><b>মোবাইল:</b> ${custPhone ? enToBnNum(custPhone) : '-'}</div>
              <div><b>ঠিকানা:</b> ${custAddress}</div>
            </div>
            <div class="address-box sender-box">
              <h4>প্রেরক (Sender):</h4>
              <div><b>Agro Shop</b></div>
              <div>০১৪০৩১৩৯৭৬৩</div>
            </div>
          </div>
          <div class="table-header">
            <span>পণ্যের বিবরণ</span>
            <span>মূল্য</span>
          </div>
          <div class="items-list">
      `;

      pageItems.forEach(item => {
        pageContent += `
          <div class="item-row">
            <span>${item.name}</span>
            <span>${item.priceText}</span>
          </div>
        `;
      });

      if (isLastPage) {
        pageContent += `
          </div>
          <div class="subtotal-row">
            <span>পণ্যের মোট মূল্য:</span>
            <span>${displaySubtotalText}</span>
          </div>
        `;
      } else {
        pageContent += `</div>`;
      }

      pageContent += `</div>`;

      if (isLastPage) {
        const grandTotal = subtotalVal + deliveryCharge;
        pageContent += `
          <div class="summary-section">
            <div class="summary-row">
              <span>ডেলিভারি চার্জ:</span>
              <span>৳${enToBnNum(deliveryCharge.toLocaleString('en-US'))}</span>
            </div>
            <div class="summary-row total-row">
              <span>সর্বমোট:</span>
              <span>৳${enToBnNum(grandTotal.toLocaleString('en-US'))}</span>
            </div>
          </div>
        `;
      }

      pageContent += `
        <div class="page-footer">
          Page ${enToBnNum(pageNum)} of ${enToBnNum(totalPages)}
        </div>
      `;

      pageDiv.innerHTML = pageContent;
      container.appendChild(pageDiv);
    });

    return true;
  }

  function openHistoryModal() {
    document.getElementById('historyModal').style.display = 'flex';
    loadHistoryList();
  }

  function closeHistoryModal() {
    document.getElementById('historyModal').style.display = 'none';
  }

  function loadHistoryList(filterText = '') {
    const container = document.getElementById('historyListContainer');
    container.innerHTML = '';

    let history = JSON.parse(localStorage.getItem('gsbd_invoice_history') || '[]');

    if(history.length === 0) {
      container.innerHTML = '<p style="text-align:center; padding:20px; color:#6c757d;">কোনো পূর্ববর্তী ইনভয়েস হিস্ট্রি সংরক্ষিত নেই।</p>';
      return;
    }

    let filtered = history.filter(item => {
      let searchStr = (item.serialNo + ' ' + item.courierId + ' ' + item.custName + ' ' + item.custPhone + ' ' + item.date).toLowerCase();
      return searchStr.includes(filterText.toLowerCase());
    });

    if(filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; padding:20px; color:#6c757d;">কোনো মিল পাওয়া যায়নি।</p>';
      return;
    }

    filtered.forEach(item => {
      const div = document.createElement('div');
      div.className = 'history-item';
      div.innerHTML = `
        <div>
          <strong>${item.serialNo}</strong> | <b>তারিখ:</b> ${enToBnNum(item.date)}<br>
          <span style="color:#0056b3;">গ্রাহক: ${item.custName} (${enToBnNum(item.custPhone)})</span><br>
          <small style="color:#6c757d;">${item.courierId ? item.courierId : 'কোনো পার্সেল আইডি নেই'}</small>
        </div>
        <div class="history-actions">
          <button class="btn-view" onclick='loadInvoiceFromHistory(${JSON.stringify(item.rawText).replace(/'/g, "&apos;")})'>🔍 দেখুন / প্রিন্ট</button>
          <button class="btn-del" onclick="deleteHistoryItem('${item.serialNo}')">🗑️ মুছুন</button>
        </div>
      `;
      container.appendChild(div);
    });
  }

  function filterHistory() {
    let query = document.getElementById('historySearchInput').value;
    loadHistoryList(query);
  }

  function loadInvoiceFromHistory(rawText) {
    document.getElementById('rawText').value = rawText;
    parseText();
    closeHistoryModal();
  }

  function deleteHistoryItem(serialNo) {
    if(confirm('আপনি কি নিশ্চিতভাবে এই হিস্ট্রিটি মুছে ফেলতে চান?')) {
      let history = JSON.parse(localStorage.getItem('gsbd_invoice_history') || '[]');
      history = history.filter(item => item.serialNo !== serialNo);
      localStorage.setItem('gsbd_invoice_history', JSON.stringify(history));
      loadHistoryList(document.getElementById('historySearchInput').value);
    }
  }

  function handlePrint() {
    const success = parseText();
    if (success) {
      setTimeout(() => {
        window.print();
      }, 250);
    }
  }

  function handleDownload() {
    const success = parseText();
    if (success) {
      setTimeout(() => {
        const element = document.getElementById('pagesContainer');
        const opt = {
          margin:    0,
          filename:    `Invoice-${Date.now()}.pdf`,
          image:    { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2, useCORS: true },
          jsPDF:    { unit: 'mm', format: 'a5', orientation: 'portrait' }
        };
        html2pdf().from(element).set(opt).save();
      }, 300);
    }
  }

  window.onload = function() {
    parseText();
  };
</script>

</body>
</html>
